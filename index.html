<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ tay official</title>
<meta name="description" content="Cuốn sổ gợi ý quán ăn của CT 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="css/book.css">
</head>
<body class="preload">

<!-- Nền ngoài cuốn sổ: thay bằng element của styleguide -->
<div class="backdrop" aria-hidden="true">
  <svg class="doodle d1" viewBox="0 0 64 64"><path d="M8 30h48a24 24 0 0 1-48 0z M4 30h56"/><path d="M22 20c0-6 6-6 6-12 M34 20c0-6 6-6 6-12"/></svg>
  <svg class="doodle d2" viewBox="0 0 64 64"><path d="M14 18h30v30a8 8 0 0 1-8 8H22a8 8 0 0 1-8-8z M44 26h6a6 6 0 0 1 0 12h-6"/></svg>
  <svg class="doodle d3" viewBox="0 0 64 64"><path d="M10 54L46 6 M20 58L54 12"/></svg>
  <svg class="doodle d4" viewBox="0 0 64 64"><path d="M32 6l7 16 17 2-13 11 4 17-15-9-15 9 4-17L8 24l17-2z"/></svg>
  <svg class="doodle d5" viewBox="0 0 64 64"><path d="M8 30h48a24 24 0 0 1-48 0z M4 30h56"/></svg>
</div>

<div class="topbar">
  <button type="button" class="pill" id="btn-toc">Mục lục</button>
  <button type="button" class="pill" id="btn-music" aria-pressed="true">♪ Nhạc: bật</button>
</div>

<main class="stage" id="stage">
  <div class="book" id="book" aria-live="polite"></div>
</main>

<nav class="controls" aria-label="Lật trang">
  <button type="button" class="arrow" id="btn-prev" aria-label="Trang trước">←</button>
  <span class="where" id="where">Bìa</span>
  <button type="button" class="arrow" id="btn-next" aria-label="Trang sau">→</button>
</nav>

<!-- Form ẩn để Netlify nhận diện khi deploy. Form thật nằm trong cuốn sổ (js/book.js). -->
<form name="goi-y" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="ten-quan"><input name="dia-chi"><input name="loai-quan"><input name="nen-thu"><input name="ly-do"><input name="khac"><input name="trai-nghiem"><input name="so-sao"><input name="khoang-cach"><input name="nguoi-goi-y"><input name="lop"><input name="bot-field">
</form>

<script src="js/data.js"></script>
<script src="js/book.js"></script>
</body>
</html>
